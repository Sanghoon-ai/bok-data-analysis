name: Delete Workflow Runs

on:
  workflow_dispatch:  # 수동 버튼 트리거만 허용

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete 100 Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔥 gh 도구가 길을 잃지 않도록 현재 저장소 이름을 강제로 인식시킵니다.
          GH_REPO: ${{ github.repository }}
        run: |
          echo "=========================================="
          echo "🚀 최근 100개의 워크플로우 기록 삭제를 시작합니다."
          echo "=========================================="
          echo "• 대상 저장소: $GH_REPO"
          
          CURRENT_RUN_ID="${{ github.run_id }}"
          
          # GH_REPO 환경변수가 주입되어 디렉토리 에러 없이 목록을 정상적으로 가져옵니다.
          runs=$(gh run list --limit 100 --json databaseId -q '.[].databaseId')
          
          if [ -z "$runs" ]; then
            echo "💡 삭제할 과거 기록이 없습니다."
            exit 0
          fi
          
          for run_id in $runs; do
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "• ID $run_id (현재 청소 작업) -> 안전하게 제외"
              continue
            fi
            
            echo "🗑️ 과거 기록 영구 삭제 중 -> ID: $run_id"
            if gh run delete "$run_id" --yes; then
              echo "   => ✅ 완전 삭제 성공"
            else
              echo "   => ❌ 삭제 실패"
            fi
          done
          
          echo "=========================================="
          echo "🎉 100개 단위의 청소 프로세스가 완료되었습니다!"
          echo "=========================================="

