name: Delete Workflow Runs

on:
  workflow_dispatch:  # 수동 트리거

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete All Workflow Runs Permanently
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 꼬이기 쉬운 깃허브 변수를 안전하게 환경변수(ENV) 영역으로 바인딩합니다.
          REPO_NAME: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "리포지토리의 모든 워크플로우 기록 삭제를 시작합니다..."
          echo "대상 리포지토리: $REPO_NAME"
          echo "현재 실행 ID (제외 대상): $CURRENT_RUN_ID"
          
          while true; do
            # ❌ github.com 주소 대신 올바른 데이터 통신용 API 주소(api.github.com)를 강제 호출합니다.
            response_json=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                                 -H "Accept: application/vnd.github+json" \
                                 "https://github.com")
            
            # API 응답에서 중단 없이 목록 ID들을 정밀 추출합니다.
            runs=$(echo "$response_json" | jq -r '.workflow_runs[].id' 2>/dev/null)
            
            # 더 이상 지울 과거 내역이 없으면 무한 루프를 탈출합니다.
            if [ -z "$runs" ]; then
              echo "더 이상 삭제할 과거 기록이 없습니다."
              break
            fi

            # 만약 목록에 현재 나 자신 딱 1개만 남아있다면 청소를 안전하게 마무리합니다.
            if [ "$runs" = "$CURRENT_RUN_ID" ]; then
              echo "현재 실행 중인 청소 작업 본인만 남았습니다. 프로세스를 종료합니다."
              break
            fi
            
            # 100개 묶음 리스트를 순회하며 완전 삭제를 집행합니다.
            for run_id in $runs; do
              # 현재 작업을 처리 중인 청소기 자신은 파괴 대상에서 건너뜁니다.
              if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
                continue
              fi
              
              echo "과거 누적 기록 삭제 진행 중 (ID: $run_id)"
              status_code=$(curl -X DELETE -s -w "%{http_code}" -o /dev/null \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://github.com")
              
              if [ "$status_code" = "204" ]; then
                echo " => 삭제 성공"
              else
                echo " => 삭제 실패 (HTTP 상태 코드: $status_code)"
              fi
            done
            
            echo "100개 청소 완료. 남아있는 다음 과거 목록을 새로고침합니다..."
            sleep 1
          done
          
          echo "🎉 과거 모든 워크플로우 실행 기록 청소가 완벽하게 성공했습니다!"

