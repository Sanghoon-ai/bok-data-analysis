name: Delete Workflow Runs

on:
  workflow_dispatch:  # GitHub 웹사이트에서 버튼을 눌러 수동 트리거

jobs:
  delete-runs:
    runs-on: ubuntu-latest

    steps:
      # 1. JSON 데이터 처리를 위한 jq 도구 설치
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 2. Curl API를 이용한 워크플로우 실행 기록 조회 및 삭제
      - name: Delete Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "모든 워크플로우 실행 기록을 가져오는 중..."
          
          # 모든 워크플로우 실행 기록의 ID 값을 추출합니다.
          runs=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/${{ github.repository }}/actions/runs" \
                       | jq '.workflow_runs[].id')
          
          # 수집된 실행 기록 ID 목록을 순회하며 순차적으로 삭제 처리를 요청합니다.
          for run_id in $runs; do
              echo "Deleting workflow run ID: $run_id"
              curl -X DELETE -s -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
          
          echo "All workflow runs deleted."
