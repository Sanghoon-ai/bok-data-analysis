name: Delete Workflow Runs

on:
  workflow_dispatch:  # 수동 트리거 버튼 생성

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Actions 기록을 수정/삭제할 수 있는 권한을 명시합니다.
      contents: read

    steps:
      - name: Delete 100 Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "🚀 최근 100개의 워크플로우 기록 삭제를 시작합니다."
          echo "=========================================="
          
          # 현재 실행 중인 이 청소 작업의 ID를 확보하여 삭제 대상에서 제외합니다.
          CURRENT_RUN_ID="${{ github.run_id }}"
          
          # 깃허브 공식 CLI 도구(gh)를 사용하여 최근 기록 100개의 ID를 안전하게 수집합니다.
          # --limit 100 옵션으로 딱 100개씩만 끊어서 가져옵니다.
          runs=$(gh run list --limit 100 --json databaseId -q '.[].databaseId')
          
          if [ -z "$runs" ]; then
            echo "💡 삭제할 과거 기록이 없습니다."
            exit 0
          fi
          
          # 가져온 ID들을 루프 돌며 순차적으로 완전 삭제 처리합니다.
          for run_id in $runs; do
            # 현재 작동하고 있는 청소기 자신은 지우지 않고 패스합니다.
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "• ID $run_id (현재 청소 작업) -> 안전하게 제외"
              continue
            fi
            
            echo "🗑️ 과거 기록 영구 삭제 중 -> ID: $run_id"
            
            # gh run delete 명령어로 권한 거부 없이 강제 삭제를 집행합니다.
            if gh run delete "$run_id" --yes; then
              echo "   => ✅ 완전 삭제 성공"
            else
              echo "   => ❌ 삭제 실패"
            fi
          done
          
          echo "=========================================="
          echo "🎉 100개 단위의 청소 프로세스가 완료되었습니다!"
          echo "=========================================="
