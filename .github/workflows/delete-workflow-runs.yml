name: Delete Workflow Runs

# ❌ push: 이나 schedule: 같은 자동 트리거를 절대 작성하지 않습니다.
on:
  workflow_dispatch:  # 🔥 오직 GitHub 웹사이트에서 "Run workflow" 버튼을 누를 때만 작동합니다.

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete 100 Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "🚀 최근 100개의 워크플로우 기록 삭제를 시작합니다."
          echo "=========================================="
          
          CURRENT_RUN_ID="${{ github.run_id }}"
          runs=$(gh run list --limit 100 --json databaseId -q '.[].databaseId')
          
          if [ -z "$runs" ]; then
            echo "💡 삭제할 과거 기록이 없습니다."
            exit 0
          fi
          
          for run_id in $runs; do
            if [ "$run_id" = "$CURRENT_RUN_ID" ]; then
              echo "• ID $run_id (현재 청소 작업) -> 안전하게 제외"
              continue
            fi
            
            echo "🗑️ 과거 기록 영구 삭제 중 -> ID: $run_id"
            if gh run delete "$run_id" --yes; then
              echo "   => ✅ 완전 삭제 성공"
            else
              echo "   => ❌ 삭제 실패"
            fi
          done
          
          echo "=========================================="
          echo "🎉 100개 단위의 청소 프로세스가 완료되었습니다!"
          echo "=========================================="
