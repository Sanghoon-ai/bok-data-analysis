name: Pages Build and Deployment

on:
  workflow_run:
    workflows:
      - Update CSV Files and Generate Chart  # main.yml에서 설정된 워크플로우 이름
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-22.04
    # GITHUB_TOKEN에 명시적인 쓰기 권한 부여
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # 1. 리포지토리 체크아웃 (안전한 브랜치 및 레포지토리 강제 참조)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 이벤트 출처가 외부 포크일 경우를 대비해 정확한 원본 레포와 헤드 브랜치를 연동합니다.
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false

      # 2. GitHub Pages에 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .  # 🔥 루트(.)를 지정해야 대문 index.html과 차트 폴더가 세트로 같이 올라갑니다.
          # 웹사이트 방문자에게 노출될 필요가 없는 파이썬 소스코드와 데이터 파일들은 안전하게 걸러냅니다.
          exclude_assets: '.github,*.py,*.csv,.gitignore'
          force_orphan: true  # fatal: a branch named 'gh-pages' already exists 깃 충돌
